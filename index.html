<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meze Defteri</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5d2a72">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Düzen: tek sütun telefon aracı; üstte durum, ortada kaydırılan liste, altta beş sekme; formlar alttan açılan panelde. */
:root{
  --bg:#f4f2f6; --surface:#ffffff; --ink:#221a2b; --muted:#6c6276; --line:#ddd7e3;
  --accent:#5d2a72; --accent-ink:#ffffff; --accent-soft:#efe6f4;
  --ok:#1f7a4d; --ok-bg:#e2f3ea; --warn:#8a5a00; --warn-bg:#fbefd0; --crit:#b3261e; --crit-bg:#fbe4e2;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17131c; --surface:#221c29; --ink:#efeaf3; --muted:#a79db2; --line:#3a3144;
  --accent:#c79be0; --accent-ink:#1c1222; --accent-soft:#33263d;
  --ok:#6fd3a0; --ok-bg:#173426; --warn:#f0c160; --warn-bg:#3b2e10; --crit:#ff9a92; --crit-bg:#431c19;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#17131c; --surface:#221c29; --ink:#efeaf3; --muted:#a79db2; --line:#3a3144;
  --accent:#c79be0; --accent-ink:#1c1222; --accent-soft:#33263d;
  --ok:#6fd3a0; --ok-bg:#173426; --warn:#f0c160; --warn-bg:#3b2e10; --crit:#ff9a92; --crit-bg:#431c19;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--body);display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:20px;letter-spacing:.01em}
h2{font-size:17px}
h3{font-size:17px}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
#stat{font-size:12px;color:var(--muted);text-align:right}
#stat button{font:inherit;color:var(--crit);background:none;border:0;text-decoration:underline;padding:0}
main{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
nav.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line)}
nav.tabs button{font:500 12px/1.15 var(--body);color:var(--muted);background:none;border:0;border-top:3px solid transparent;padding:11px 2px 12px}
nav.tabs button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tot{font-size:13px;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows li{border-top:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:6px}
.r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.r2{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font:700 11px var(--display);letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
.tag.raf{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pill{font-size:12px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.qty{font:700 17px var(--display);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{font:500 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.5}
.btn:focus-visible,input:focus-visible,select:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar .btn{flex:1 1 auto}
.sum{display:flex;gap:8px;flex-wrap:wrap}
.sum .pill{font-size:13px;padding:4px 10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 140px;min-width:0}
input,select,textarea{font:400 16px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.grid2{display:flex;gap:10px;flex-wrap:wrap}
.cevrimdisi .foto{display:none!important}
.gizli{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
label.btn{position:relative}
textarea{min-height:140px;resize:vertical}
.indir{display:none}
body.indir-ok .indir{display:inline-flex}
.etiket{border:2px dashed var(--accent);border-radius:8px;padding:10px;display:flex;gap:16px;justify-content:space-around;text-align:center}
.etiket b{display:block;font:700 22px var(--display)}
.msg{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);color:var(--ink)}
.msg.err{background:var(--crit-bg);color:var(--crit)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.orow{border-top:1px solid var(--line);padding:8px 0;display:grid;grid-template-columns:1fr 1fr 1fr 92px;gap:6px;align-items:end}
.orow .n{grid-column:1/-1;font-weight:600}
.orow .c{font-size:12px;color:var(--muted)}
.orow .c b{display:block;font:700 16px var(--display);color:var(--ink)}
.orow input{padding:7px 8px;text-align:right}
.orow i,.hint{display:block;font:400 12px var(--body);font-style:normal;color:var(--muted);margin-top:2px}
.qty small{font:500 13px var(--body);color:var(--muted)}
.fark{font-weight:600}
.toplam{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.toplam .qty{font-size:22px}
.bild{border-left:4px solid var(--accent)}
.bild h3{font-size:15px;display:flex;justify-content:space-between;gap:8px}
.bild ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.bild .sec{display:flex;flex-direction:column;gap:4px;padding-top:6px;border-top:1px solid var(--line)}
.say{font:700 13px var(--display);padding:0 7px;border-radius:99px;background:var(--crit-bg);color:var(--crit)}
.say.warn{background:var(--warn-bg);color:var(--warn)}
.say.ok{background:var(--ok-bg);color:var(--ok)}
.ana{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ana div{font-size:12px;color:var(--muted)}
.ana b{display:block;font:700 16px var(--display);color:var(--ink)}
.srow{border-top:1px solid var(--line);padding:7px 0;display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center}
.srow input{text-align:right}
#scrim{position:fixed;inset:0;background:rgba(20,10,30,.5);display:none;align-items:flex-end;z-index:5}
#scrim.on{display:flex}
#sheet{background:var(--surface);width:100%;max-height:92%;overflow-y:auto;border-radius:14px 14px 0 0;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
#sheet>header{display:flex;justify-content:space-between;align-items:center;gap:8px}
#sheetBody{display:flex;flex-direction:column;gap:12px}
.krow{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
ol.adim{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
@media (min-width:700px){main,header.top{padding-left:calc(50% - 334px);padding-right:calc(50% - 334px)}#sheet{max-width:700px;margin:0 auto}}
@media (prefers-reduced-motion:no-preference){.btn{transition:opacity .15s}}
</style>
</head>
<body>
<header class="top"><h1>Meze Defteri</h1><button type="button" class="btn sm pri" id="kurBtn" hidden>Uygulamayı yükle</button><div id="stat">Yükleniyor…</div></header>
<main id="main"><div class="card"><p class="muted">Kayıtlar yükleniyor…</p></div></main>
<nav class="tabs" id="tabs" aria-label="Bölümler">
  <button type="button" data-tab="stok">Stok</button>
  <button type="button" data-tab="siparis">Sipariş</button>
  <button type="button" data-tab="satis">Satış</button>
  <button type="button" data-tab="imha">İmha</button>
  <button type="button" data-tab="reel">Reel stok</button>
  <button type="button" data-tab="urun">Ürünler</button>
</nav>
<div id="scrim"><section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
  <header><h2 id="sheetT"></h2><button type="button" class="btn sm" data-act="kapat">Kapat</button></header>
  <div id="sheetBody"></div>
</section></div>
<script src="xlsx.full.min.js"></script>
<script>
"use strict";
/* ---------- yardımcılar ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const okT=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const GUN=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const fmt=s=>okT(s)?s.slice(8)+'.'+s.slice(5,7)+' '+GUN[pd(s).getDay()]:'—';
const fmtY=s=>okT(s)?s.slice(8)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'';
const num=v=>{let s=String(v??'').trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0};
const r2=n=>Math.round(n*1000)/1000; // kg için gram hassasiyeti
const q=n=>r2(n).toLocaleString('tr-TR');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const norm=s=>String(s??'').toLocaleLowerCase('tr').replace(/[^a-z0-9çğıöşü]/g,'');
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);

/* ---------- durum ---------- */
let S={urun:[],lot:[],raf:[],sip:[],sistem:null,eksi:{}};           // 'ana' belgesi
let M={};                                         // 'ay-YYYY-AA' belgeleri: {satis:{gün:{pid:miktar}},rafLog:[],imha:[]}
const C={sheet:null,O:null,T:null};               // form bağlamları
let APP=false,fotoVar=null,tab='stok',store=null,ready=false,sample=null,downloads=null,sheetFn=null;
const P=id=>S.urun.find(u=>u.id===id);
const ay=t=>M[t.slice(0,7)]??={satis:{},rafLog:[],imha:[]};
const ayKey=t=>'ay-'+t.slice(0,7);
const birim=()=>'kg';
const fmtN=n=>String(r2(n)).replace('.',',');

/* Ana değerler: kutu = kutu gramajı (kg); sinir = SKT'den kaç gün öncesine kadar rafa çıkabilir;
   RKT kuralı: 'acilis' = açılış + gün, 'skt' = SKT − gün; RKT SKT'yi geçemez */
const kk=u=>{const k=+u?.kutu;return k>0?k:0};
const kutuN=(u,kg)=>kk(u)?Math.round(kg/kk(u)*10)/10:null;
const mk=(u,kg)=>q(kg)+' kg'+(kk(u)?' · '+q(kutuN(u,kg))+' kutu':'');
const qtyH=(u,kg)=>`<span class="qty num">${q(kg)} kg${kk(u)?`<small> · ${q(kutuN(u,kg))} kutu</small>`:''}</span>`;
const kutuI=(u,kg)=>kk(u)?`<i>${q(kutuN(u,kg))} kutu</i>`:'';
const enGec=(u,skt)=>addD(skt,-(+u.sinir||0));
function rktHesap(u,skt,acilis){if(!u.kural)return '';const r=u.kural==='skt'?addD(skt,-(+u.gun||0)):addD(acilis,+u.gun||0);return r<skt?r:skt}
const kuralYazi=u=>`Rafa en geç SKT'den ${+u.sinir||0} gün önce çıkar · RKT: `+(!u.kural?'etiketten elle girilir':u.kural==='skt'?`SKT − ${+u.gun||0} gün`:`açılış + ${+u.gun||0} gün`);
const depo=pid=>sum(S.lot.filter(l=>l.pid===pid),l=>l.depo);
const rafT=pid=>sum(S.raf.filter(r=>r.pid===pid),r=>r.m);
const yolda=pid=>sum(S.sip.filter(s=>s.durum==='bekliyor'),s=>+(s.k[pid]||0));

/* ---------- kayıt ---------- */
const use=n=>window.claude?.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
const sure=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:'zaman'}),ms))]);
const dirty=new Set();let chain=Promise.resolve(),timer=null;
async function dosyaVer(ad,data,tip){
  if(downloads)return downloads.save({filename:ad,data});
  const u=URL.createObjectURL(new Blob([data],{type:tip})),a=document.createElement('a');a.href=u;a.download=ad;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function setStat(html){$('#stat').innerHTML=html}
function save(...keys){keys.forEach(k=>dirty.add(k));setStat('Kaydediliyor…');clearTimeout(timer);timer=setTimeout(flush,300)}
function flush(){
  chain=chain.then(async()=>{
    const ks=[...dirty];dirty.clear();let hata=null;
    for(const k of ks){
      const body=k==='ana'?S:M[k.slice(3)];
      try{await store.put(k,JSON.parse(JSON.stringify(body)))}catch(e){dirty.add(k);hata=e}
    }
    if(hata)setStat((hata.code==='quota_exceeded'?'Kayıt alanı doldu. ':'Kaydedilemedi. ')+'<button type="button" data-act="tekrarKaydet">Tekrar dene</button>');
    else if(!dirty.size)setStat(store.yerel?'Bu telefonda kayıtlı':'Kaydedildi');
  });
}
async function kur(){
  APP=!window.claude;if(APP)document.body.classList.add('cevrimdisi','indir-ok');
  const [db,user,sm,dl]=await Promise.all([use('db'),use('user'),use('sample'),use('downloads')]);
  downloads=dl;if(dl)document.body.classList.add('indir-ok');
  if(sm){sample=sm;sm.limits().then(l=>{fotoVar=!!l?.images}).catch(()=>{fotoVar=false})}
  const id=user?await user.id():null;
  if(db&&id){
    const col=db.collection('data/users/'+id);
    store={yerel:false,
      async load(){const s=await sure(col.get(),10000);const o={};s.docs.forEach(d=>{o[d.id]=JSON.parse(JSON.stringify(d.data()))});return o},
      put:(k,b)=>col.doc(k).set(b)};
  }else{
    store={yerel:true,
      async load(){const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('meze:'))o[k.slice(5)]=JSON.parse(localStorage.getItem(k))}}catch(e){}return o},
      async put(k,b){localStorage.setItem('meze:'+k,JSON.stringify(b))}};
    try{navigator.storage?.persist?.()}catch(e){};
  }
  await yukle();
}
async function yukle(){
  setStat('Yükleniyor…');
  try{
    const o=await store.load();
    if(o.ana)S=Object.assign({urun:[],lot:[],raf:[],sip:[],sistem:null,eksi:{}},o.ana);
    for(const u of S.urun)if(u.sinir==null)u.sinir=u.kural==='skt'?(+u.gun||0):(+u.marj||0);
    for(const k in o)if(k.startsWith('ay-'))M[k.slice(3)]=Object.assign({satis:{},rafLog:[],imha:[]},o[k]);
    ready=true;setStat(store.yerel?'Bu telefonda kayıtlı':'Kaydedildi');render();
  }catch(e){
    setStat('Bağlanılamadı');
    $('#main').innerHTML='<div class="card"><p>Kayıtlara ulaşılamadı. İnternet bağlantınızı kontrol edip tekrar deneyin.</p><div class="bar"><button type="button" class="btn pri" data-act="tekrarYukle">Tekrar dene</button></div></div>';
  }
}

/* ---------- stok hareketleri ---------- */
function lotEkle(pid,skt,m){const l=S.lot.find(x=>x.pid===pid&&x.skt===skt);if(l)l.depo=r2(l.depo+m);else S.lot.push({id:uid(),pid,skt,depo:r2(m),giris:today()})}
function temizle(){S.lot=S.lot.filter(l=>l.depo>0.0001);S.raf=S.raf.filter(r=>r.m>0.0001);S.sip=S.sip.slice(-40)}
/* satış farkını raftan düşer (en erken RKT önce); eksik kalan miktarı döndürür */
function raftanDus(pid,d){
  const rs=S.raf.filter(r=>r.pid===pid).sort((a,b)=>a.rkt<b.rkt?-1:1);
  if(d<0){if(rs[0])rs[0].m=r2(rs[0].m-d);return 0}
  for(const r of rs){if(d<=0)break;const x=Math.min(r.m,d);r.m=r2(r.m-x);d=r2(d-x)}
  return d;
}
function lotPill(u,l,t){
  if(l.skt<t)return{c:'crit',y:'SKT geçti'};
  const d=diff(enGec(u,l.skt),t);
  if(d<0)return{c:'crit',y:'Rafa çıkamaz'};
  if(d===0)return{c:'warn',y:'Son gün bugün'};
  return{c:d<=2?'warn':'',y:d+' gün kaldı'};
}
function rafPill(r,t){const d=diff(r.rkt,t);if(d<0)return{c:'crit',y:'RKT geçti'};if(d===0)return{c:'warn',y:'Bugün kaldır'};return{c:'',y:d+' gün'}}

/* ---------- görünümler ---------- */
function bos(){return `<div class="card"><h2>Önce ürünlerinizi ekleyin</h2>
<ol class="adim"><li>Ana değerleri girin: ürün adı, kodu, kutu gramajı ve SKT'den kaç gün öncesine kadar rafa çıkabileceği.</li><li>Gelen malı SKT'siyle depoya alın.</li><li>Rafa çıkarırken RKT'yi buradan okuyun; satış ve imhayı işleyin.</li></ol>
<div class="bar"><label class="btn"><input type="file" accept=".xlsx,.xls,.csv" class="gizli" data-foto="urunExcel">Excel'den ürün listesi al</label><button type="button" class="btn" data-act="urunYeni">Ürün ekle</button>
<label class="btn foto"><input type="file" accept="image/*" class="gizli" data-foto="urunListe">Listeyi fotoğraftan ekle</label></div></div>`}

/* Günlük bildirim: her açılışta bugüne göre hesaplanır */
function bildirim(){
  const t=today(),yarin=addD(t,1),B={rafa:[],kaldir:[],uyus:[],eksi:[]},sayilmadi=[];
  for(const u of S.urun){
    const ls=S.lot.filter(l=>l.pid===u.id).sort((a,b)=>a.skt<b.skt?-1:1),rafVar=rafT(u.id)>0.0001;
    for(const l of ls){const son=enGec(u,l.skt);
      if(son<t||l.skt<=t)B.kaldir.push({u,y:`Depoda SKT ${fmtY(l.skt)}, ${mk(u,l.depo)}: rafa çıkış süresi geçti, imha edin`});
      else if(son<=yarin)B.rafa.push({u,y:`SKT ${fmtY(l.skt)}, ${mk(u,l.depo)}: son rafa çıkış ${son===t?'bugün':'yarın'}`});}
    const ilk=ls.find(l=>enGec(u,l.skt)>yarin&&l.skt>t);
    if(!rafVar&&ilk&&!B.rafa.some(z=>z.u===u))B.rafa.push({u,y:`Rafta yok; depoda var. İlk açılacak: SKT ${fmtY(ilk.skt)}`});
    for(const r of S.raf.filter(r=>r.pid===u.id))if(r.rkt<=t)B.kaldir.push({u,y:`Rafta RKT ${fmtY(r.rkt)}, ${q(r.m)} kg: ${r.rkt<t?'süresi geçti':'bugün kaldırın'}`});
    const sm=sisM(u.id);
    if(sm!=null&&!u.sayim&&!(reel(u.id)>0)){if(sm>0)sayilmadi.push(u.ad)}
    else if(sm!=null&&Math.abs(reel(u.id)-sm)>=0.01){const f=r2(reel(u.id)-sm);B.uyus.push({u,y:`Sistem ${q(sm)} kg, reel ${q(reel(u.id))} kg, fark ${f>0?'+':''}${q(f)} kg`})}
    if(sm!=null&&sm<0)B.eksi.push({u,y:`Sistem stoğu eksi: ${q(sm)} kg (${fmtY(S.sistem.tarih)})`});

function teslimOf(t){const g=pd(t).getDay();return addD(t,g===1?4:g===4?5:4)}
function ortSatis(pid){
  const t=today();let top=0,gun=0;
  for(let i=1;i<=14;i++){const d=addD(t,-i),s=M[d.slice(0,7)]?.satis?.[d];if(s){gun++;top+=+(s[pid]||0)}}
  return gun?top/gun:null;
}
function oneri(u,O){
  const o=ortSatis(u.id);if(o==null||!okT(O.teslim)||!okT(O.tarih))return 0;
  const g=pd(O.teslim).getDay(),ufuk=Math.max(0,diff(O.teslim,O.tarih))+(g===2?3:4);
  const n=o*ufuk-depo(u.id)-rafT(u.id)-yolda(u.id);
  if(n<=0)return 0;const k=kk(u);return k?r2(Math.ceil(n/k-1e-9)*k):Math.ceil(n*2)/2;
}

const temizAd=s=>String(s).trim().replace(/\s+/g,' ').replace(/\s+KG\.?(?=\s*(\(\d+\))?\s*$)/i,'');
function fExcel(x){const o=sel=>x.bas.map((h,i)=>`<option value="${i}"${i===+sel?' selected':''}>${esc(h||('Sütun '+(i+1)))}</option>`).join('');
  const s=excelEsle(x);

  <label class="f">Ürün kodu sütunu<select id="x-k" data-c="sheet" data-k="ck" data-yenile="1"><option value="-1">Yok</option>${o(x.ck)}</select></label>
  <label class="f">Satış miktarı sütunu<select id="x-m" data-c="sheet" data-k="cm" data-yenile="1">${o(x.cm)}</select></label>
  <p class="msg">${s.n} ürün eşleşti.${s.yok.length?' Listede olmayanlar: '+esc(s.yok.slice(0,8).join(', '))+(s.yok.length>8?'…':''):''}</p>
  <div class="bar"><button type="button" class="btn pri" data-act="excelUygula"${s.n?'':' disabled'}>Miktarları forma aktar</button></div>`}
function sutunBul(bas){const b=(list,d,x)=>{for(const re of list){const i=bas.findIndex((h,j)=>j!==x&&re.test(h));if(i>=0)return i}return d};
  const ck=b([/ürün no|urun no|ürün kod|urun kod|stok kod|malzeme kod|malzeme no|^malzeme$|^kod|barkod/i,/kod|^no$/i],-1);
  return{ck,ca:b([/ürün ad|urun ad|stok ad|malzeme ad|mal ad|tanım|kısa metin|metin|açıklama/i,/ad/i,/ürün|urun|malzeme/i],ck===0?1:0,ck)}}
function excelEsle(x){const v={},yok=[];
  for(const r of x.satir){const ad=norm(temizAd(r[+x.ca]??'')),kod=+x.ck>=0?String(r[+x.ck]??'').trim():'',m=num(r[+x.cm]);
    if(!ad&&!kod||!m)continue;
    const u=S.urun.find(u=>(kod&&u.kod&&String(u.kod).trim()===kod)||(ad&&norm(u.ad)===ad))||S.urun.find(u=>ad.length>3&&(norm(u.ad).includes(ad)||ad.includes(norm(u.ad))));
    if(u)v[u.id]=r2((v[u.id]||0)+m);else if(r[+x.ca])yok.push(String(r[+x.ca]));}
  return{v,n:Object.keys(v).length,yok:[...new Set(yok)]}}

const hataYazi=e=>(HATA[e?.code]||'Fotoğraf okunamadı; tekrar deneyin ya da elle girin.')+(e?.code&&e.code!=='yok'?' (kod: '+e.code+')':'');
/* Telefon fotoğrafını küçültüp JPEG'e çevirir; tarayıcı çözemezse dosyayı olduğu gibi gönderir */
async function hazirla(f){
  try{
    const bm=await createImageBitmap(f,{imageOrientation:'from-image'});
    const s=Math.min(1,2000/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
    c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);bm.close?.();
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.88));return b||f;
  }catch(e){return f}
}
const urunJson=()=>JSON.stringify(S.urun.map(u=>({id:u.id,ad:u.ad,kod:u.kod||''})));
const TARIH=`Bugünün tarihi ${today()}. Etiketlerde tarih gün.ay.yıl sırasındadır; tarihleri "YYYY-AA-GG" olarak ver. SKT etikette "SKT", "TETT", "S.T.T.", "Son Tüketim Tarihi" ya da "EXP" olarak geçebilir; üretim tarihini (ÜT) SKT sanma. Okuyamadığın ya da emin olmadığın alanı null bırak.`;
async function oku(f,p){if(!sample||fotoVar===false)throw{code:sample?'images_unavailable':'yok'};return sample.json(p,{images:[await hazirla(f)],cache:false})}
const F={
  async kabul(f,el){const x=C.sheet,r=x.rows[+el.dataset.i];x.busy=true;r.not='Fotoğraf okunuyor…';yenile();
    try{const j=await oku(f,`Fotoğrafta bir gıda ürününün paketi, kolisi ya da etiketi var. ${TARIH}\nÜrün listesi: ${urunJson()}\nYalnızca şu JSON nesnesiyle yanıt ver: {"pid": listeden eşleşen ürünün id'si ya da null, "urunAdi": etikette okunan ürün adı ya da null, "skt": tarih ya da null}`);
      if(C.sheet!==x)return;
      if(okT(j?.skt))r.skt=j.skt;if(!r.pid&&P(j?.pid)){r.pid=j.pid;const k=kk(P(r.pid));if(k&&num(r.k))r.m=fmtN(num(r.k)*k)}
      r.not=okT(j?.skt)?`Okunan SKT ${fmtY(j.skt)}${j.urunAdi?' ('+j.urunAdi+')':''}. Paketle karşılaştırıp kontrol edin.`:'SKT okunamadı; elle girin.';
    }catch(e){if(C.sheet!==x)return;r.not=hataYazi(e)}
    x.busy=false;yenile()},
  async imha(f){if(!C.sheet||sheetFn!==fImha)A.imhaAc();const x=C.sheet;x.busy=true;x.msg='Fotoğraf okunuyor…';x.mc='';yenile();
    try{const j=await oku(f,`Fotoğrafta bir marketin imha etiketi ya da imha tutanağı var. ${TARIH}\nÜrün listesi: ${urunJson()}\nYalnızca şu JSON nesnesiyle yanıt ver: {"pid": listeden eşleşen ürünün id'si ya da null, "urunAdi": okunan ürün adı ya da null, "skt": tarih ya da null, "rkt": raf kaldırma tarihi ya da null, "miktar": sayı ya da null, "tarih": imha tarihi ya da null, "neden": "SKT" ya da "RKT" ya da "Diğer" ya da null, "teslim": teslim alan kişi ya da null}`);
      if(C.sheet!==x)return;
      if(P(j?.pid))x.pid=j.pid;if(okT(j?.skt))x.skt=j.skt;if(okT(j?.rkt))x.rkt=j.rkt;if(okT(j?.tarih))x.t=j.tarih;
      if(j?.miktar)x.m=String(j.miktar).replace('.',',');if(['SKT','RKT','Diğer'].includes(j?.neden))x.neden=j.neden;if(j?.teslim)x.teslim=String(j.teslim);
      const k=imhaKaynak(x.pid).find(k=>(x.skt&&k.y.includes('SKT '+fmtY(x.skt)))||(x.rkt&&k.y.includes('RKT '+fmtY(x.rkt))));if(k)x.src=k.v;
      x.msg=`Etiket okundu${j?.urunAdi?' ('+j.urunAdi+')':''}. Alanları etiketle karşılaştırıp kontrol edin.`;x.mc='warn';
    }catch(e){if(C.sheet!==x)return;x.msg=hataYazi(e);x.mc='err'}
    x.busy=false;yenile()},
  async urunListe(f){const x={rows:[],msg:'Liste okunuyor. Uzun listelerde bir dakikayı bulabilir; sayfayı kapatmayın.'};ac('Fotoğraftan ürün ekle',fListe,x);
    try{const j=await oku(f,`Fotoğrafta bir marketin meze bölümüne ait ürün listesi var. Listedeki her ürün için bir nesne içeren JSON dizisiyle yanıt ver, başka metin yazma: [{"ad": ürün adı, "kod": ürün/stok kodu ya da "", "kutu": kutu/koli gramajı kg cinsinden sayı ya da null}]. Başlık satırlarını ve toplamları alma.`);
      if(C.sheet!==x)return;

  async urunExcel(f){
    const hata=m=>{ac("Excel'den ürün listesi",x=>mesaj(x),{msg:m,mc:'err'})};
    try{if(!window.XLSX)throw 0;
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      const h=rows.findIndex((r,i)=>i<20&&r.some(c=>/ad|ürün|urun/i.test(String(c))));
      if(h<0)return hata("Dosyada ürün adı sütunu bulunamadı. İlk satırda 'Ürün Adı' gibi bir başlık olmalı.");
      const bas=rows[h].map(c=>String(c).trim()),bul=re=>bas.findIndex(b=>re.test(b));
      const ca=bul(/ad/i),ck=bul(/no|kod|barkod/i),cg=bul(/gün|gun/i),cb=bul(/ambalaj|gram|gr|kutu|koli/i);
      if(ca<0)return hata("Dosyada ürün adı sütunu bulunamadı.");
      const out=[];
      for(const r of rows.slice(h+1)){const ad=temizAd(r[ca]||''),kod=ck>=0?String(r[ck]).trim():'';
        if(!ad||/^toplam/i.test(ad)||/^toplam/i.test(kod))continue;
        let kutu=cb>=0?num(r[cb]):0;if(kutu>20)kutu=kutu/1000;
        const u=S.urun.find(u=>(kod&&u.kod&&String(u.kod)===kod)||norm(u.ad)===norm(ad));
        out.push({uid:u?.id||'',ad,kod,kutu:Math.round(kutu*1000)/1000,sinir:cg>=0?Math.max(0,Math.round(num(r[cg]))):(u?.sinir||0)});}
      if(!out.length)return hata('Dosyada ürün satırı bulunamadı.');
      ac("Excel'den ürün listesi",fUrunExcel,{rows:out});
    }catch(e){hata('Dosya okunamadı. Ürün listesinin Excel dosyasını (.xlsx) seçin.')}},
  async sistemExcel(f){

    if(tur==='stok')r=[['Ürün','Kod','Yer','SKT','RKT','Son rafa çıkış','Kg','Kutu'],...S.lot.map(l=>{const u=P(l.pid);return[u?.ad,u?.kod,'Depo',fmtY(l.skt),'',u?fmtY(enGec(u,l.skt)):'',n(l.depo),kk(u)?n(kutuN(u,l.depo)):'']}),...S.raf.map(x=>{const u=P(x.pid);return[u?.ad,u?.kod,'Raf',fmtY(x.skt),fmtY(x.rkt),'',n(x.m),kk(u)?n(kutuN(u,x.m)):'']})];
    if(tur==='raf'){r=[['Rafa çıkış','Ürün','SKT','RKT','Miktar','Birim']];for(const k of Object.keys(M).sort())for(const x of M[k].rafLog||[])r.push([fmtY(x.t),x.ad,fmtY(x.skt),fmtY(x.rkt),n(x.m),x.b])}
    if(tur==='imha'){r=[['İmha günü','Ürün','Miktar','Birim','Neden','SKT','RKT','Teslim alan','Not']];for(const x of imhaListe().reverse())r.push([fmtY(x.t),x.ad,n(x.m),x.b,x.neden,fmtY(x.skt),fmtY(x.rkt),x.teslim,x.not])}
    if(tur==='satis'){r=[['Gün','Ürün','Miktar']];for(const k of Object.keys(M).sort())for(const d of Object.keys(M[k].satis||{}).sort())for(const p in M[k].satis[d])r.push([fmtY(d),P(p)?.ad||p,n(M[k].satis[d][p])])}
    const data='﻿'+r.map(s=>s.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
    try{await dosyaVer(`meze-${tur}-${today()}.csv`,data,'text/csv')}catch(e){if(e?.code!=='declined'){const m=$('#csvMsg');if(m)m.textContent='Dosya kaydedilemedi; biraz sonra tekrar deneyin.'}}}
};
function imhaSrc(x){const [tur,id]=x.src.split(':');
  if(tur==='L'){const l=S.lot.find(a=>a.id===id);if(l){x.pid=l.pid;x.skt=l.skt;x.rkt='';x.m=String(l.depo).replace('.',',');x.neden=l.skt<=today()?'SKT':'Diğer'}}
  if(tur==='R'){const r=S.raf.find(a=>a.id===id);if(r){x.pid=r.pid;x.skt=r.skt;x.rkt=r.rkt;x.m=String(r.m).replace('.',',');x.neden='RKT'}}}

/* ---------- olaylar ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;return render()}
  const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act])return A[a.dataset.act](a);
  if(e.target.id==='scrim')kapat();
});
function bagla(el){
  if(!el.dataset||!el.dataset.k||!el.dataset.c)return false;
  const o=el.dataset.c.split('.').reduce((x,k)=>x?.[k],C);if(!o)return false;o[el.dataset.k]=el.value;return true;
}
document.addEventListener('input',e=>{const el=e.target;if(!bagla(el))return;
  const per=+el.dataset.per;
  if(el.dataset.esle&&per){const t=document.getElementById(el.dataset.esle);if(t){const v=num(el.value);t.value=el.value.trim()===''?'':fmtN(el.dataset.ters?v/per:v*per);bagla(t)}}
  if(el.dataset.hint){const hn=document.getElementById(el.dataset.hint);if(hn)hn.textContent=per?(num(el.value)?'≈ '+q(Math.round(num(el.value)/per*10)/10)+' kutu':'kutu '+q(per)+' kg'):''}
  if(el.dataset.bul){C.sheet.bul=true;const b=$('#bulSonuc');if(b)b.innerHTML=bulSonuc(C.sheet)}
  if(el.id==='rf-t'&&okT(el.value)){const x=C.sheet,l=S.lot.find(a=>a.id===x.id);if(!P(l.pid).kural)return;x.rkt=rktHesap(P(l.pid),l.skt,el.value);$('#rf-r').value=x.rkt;$('#rf-rkt').textContent=fmtY(x.rkt)}
  if(el.id==='rf-r')$('#rf-rkt').textContent=fmtY(el.value);
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.type==='file'&&el.dataset.foto){const f=el.files[0],fn=F[el.dataset.foto];el.value='';if(f&&fn)fn(f,el);return}
  if(!bagla(el))return;
  if(el.id==='i-p'){C.sheet.src=''}
  if(/^k-p\d+$/.test(el.id)){const r=C.sheet.rows[+el.id.slice(3)],k=kk(P(r.pid));if(k&&num(r.k))r.m=fmtN(num(r.k)*k)}
  if(el.id==='i-s'&&el.value)imhaSrc(C.sheet);
  if(el.dataset.yenile)yenile();
  if(el.id==='o-tarih'&&okT(el.value)){C.O.teslim=teslimOf(el.value);render()}
  if(el.id==='o-teslim')render();
  if(el.id==='t-tarih'&&okT(el.value)){C.T={tarih:el.value,v:satisYukle(el.value)};render()}
});
document.addEventListener('submit',e=>e.preventDefault());
render();kur();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
let kurOlay=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();kurOlay=e;$('#kurBtn').hidden=false});
$('#kurBtn').addEventListener('click',async()=>{if(!kurOlay)return;kurOlay.prompt();await kurOlay.userChoice.catch(()=>{});kurOlay=null;$('#kurBtn').hidden=true});
</script>
